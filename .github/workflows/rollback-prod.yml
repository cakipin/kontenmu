name: Rollback Production

on:
  repository_dispatch:
    types: [rollback-production]

jobs:
  rollback-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Rollback Frontend Deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/rollback-pages.mjs kontenmu-prod

      - name: Rollback Backend Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback --env production --yes --message "Production rollback"
        working-directory: workers/sales-api

      - name: Smoke Test Rolled Back Production
        run: node .github/scripts/smoke-test.mjs https://kontenmu-prod.pages.dev https://kontenmu-prod-api.1912.workers.dev
