        continue-on-error: true

      - name: Migrate Database Schema - masa_aktif
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN masa_aktif TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - picture
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN picture TEXT;"
        continue-on-error: true

      - name: Deploy Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: workers/sales-api
