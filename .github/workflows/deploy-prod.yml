name: Deploy Production

on:
  repository_dispatch:
    types: [deploy-production]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          echo "VITE_API_URL=https://kontenmu-prod-api.1912.workers.dev" > apps/portal-agen/.env.production
          echo "VITE_CLIENT_ID=client_svRBFbrf9AK7GMPAAOMZrXRa" >> apps/portal-agen/.env.production
          echo "VITE_UPLOAD_API_URL=https://kontenmu.pages.dev" >> apps/portal-agen/.env.production
          npm run build
        env:
          VITE_API_URL: https://kontenmu-prod-api.1912.workers.dev

      - name: Apply Production Bindings Configuration
        run: cp apps/portal-agen/wrangler-prod.toml apps/portal-agen/wrangler.toml

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kontenmu-prod --branch main
          workingDirectory: apps/portal-agen

      - name: Migrate Database Schema - npsn
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN npsn TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - nuptk
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN nuptk TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - nip
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN nip TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - password
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN password TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - sekolah_id
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN sekolah_id TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - app_data
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "CREATE TABLE IF NOT EXISTS app_data (id TEXT PRIMARY KEY, value TEXT); INSERT OR IGNORE INTO app_data (id, value) VALUES ('app_state', '{}');"
        continue-on-error: true


      - name: Migrate Database Schema - email
        uses: cloudflare/wrangler-action@v3
