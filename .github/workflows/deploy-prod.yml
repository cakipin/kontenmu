          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN sso_id TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - requested_role
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN requested_role TEXT;"
        continue-on-error: true

      - name: Migrate Database Schema - surat_tugas
        uses: cloudflare/wrangler-action@v3
        with:
