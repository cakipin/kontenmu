name: Deploy Production

on:
  repository_dispatch:
    types: [deploy-production]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Migrate and Verify Production Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/migrate-d1.mjs KONTENMU_PROD_DB

      - name: Build Application
        run: |
          echo "VITE_API_URL=https://kontenmu-prod-api.1912.workers.dev" > apps/portal-agen/.env.production
          echo "VITE_CLIENT_ID=${{ secrets.PROD_SSO_CLIENT_ID }}" >> apps/portal-agen/.env.production
          npm run build
        env:
          VITE_API_URL: https://kontenmu-prod-api.1912.workers.dev

      - name: Apply Production Bindings Configuration
        run: cp apps/portal-agen/wrangler-prod.toml apps/portal-agen/wrangler.toml

      - name: Set Pages Authentication Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo -n "${{ secrets.JWT_SECRET }}" | npx wrangler pages secret put JWT_SECRET --project-name kontenmu-prod

      - name: Set Pages SSO Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ secrets.PROD_SSO_CLIENT_ID }}" | npx wrangler pages secret put CLIENT_ID --project-name kontenmu-prod
          echo -n "${{ secrets.PROD_SSO_CLIENT_SECRET }}" | npx wrangler pages secret put CLIENT_SECRET --project-name kontenmu-prod

      - name: Set R2 Secrets on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ secrets.R2_ACCESS_KEY_ID }}" | npx wrangler pages secret put R2_ACCESS_KEY_ID --project-name kontenmu-prod
          echo -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" | npx wrangler pages secret put R2_SECRET_ACCESS_KEY --project-name kontenmu-prod
          echo -n "${{ secrets.R2_ACCOUNT_ID }}" | npx wrangler pages secret put R2_ACCOUNT_ID --project-name kontenmu-prod

      - name: Deploy Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          command: deploy
          secrets: JWT_SECRET
          workingDirectory: workers/sales-api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kontenmu-prod --branch main
          workingDirectory: apps/portal-agen

      - name: Smoke Test Production
        run: node .github/scripts/smoke-test.mjs https://kontenmu-prod.pages.dev https://kontenmu-prod-api.1912.workers.dev
