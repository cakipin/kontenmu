name: Deploy Production

on:
  repository_dispatch:
    types: [deploy-production]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          echo "VITE_API_URL=https://kontenmu-prod-api.1912.workers.dev" > apps/portal-agen/.env.production
          echo "VITE_CLIENT_ID=client_svRBFbrf9AK7GMPAAOMZrXRa" >> apps/portal-agen/.env.production
          npm run build
        env:
          VITE_API_URL: https://kontenmu-prod-api.1912.workers.dev

      - name: Apply Production Bindings Configuration
        run: cp apps/portal-agen/wrangler-prod.toml apps/portal-agen/wrangler.toml

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kontenmu-prod --branch main
          workingDirectory: apps/portal-agen

      - name: Migrate Database Schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute KONTENMU_PROD_DB --remote --command "ALTER TABLE users ADD COLUMN npsn TEXT; ALTER TABLE users ADD COLUMN nuptk TEXT; ALTER TABLE users ADD COLUMN nip TEXT; ALTER TABLE users ADD COLUMN password TEXT; CREATE TABLE IF NOT EXISTS app_data (id TEXT PRIMARY KEY, value TEXT); INSERT OR IGNORE INTO app_data (id, value) VALUES ('app_state', '{}');"
        continue-on-error: true

      - name: Deploy Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: workers/sales-api
