name: Deploy Staging

on:
  repository_dispatch:
    types: [manual-push-from-dashboard]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Migrate and Verify Staging Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/migrate-d1.mjs KONTENMU_DB

      - name: Build Application
        run: |
          echo "VITE_API_URL=https://sales-api.1912.workers.dev" > apps/portal-agen/.env
          echo "VITE_CLIENT_ID=client_svRBFbrf9AK7GMPAAOMZrXRa" >> apps/portal-agen/.env
          npm run build
        env:
          VITE_API_URL: https://sales-api.1912.workers.dev

      - name: Validate Authentication Secret
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "JWT_SECRET wajib tersedia agar sesi dapat menyimpan perubahan."
            exit 1
          fi

      - name: Set Pages Authentication Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo -n "${{ secrets.JWT_SECRET }}" | npx wrangler pages secret put JWT_SECRET --project-name kontenmu

      - name: Set R2 Secrets on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ secrets.R2_ACCESS_KEY_ID }}" | npx wrangler pages secret put R2_ACCESS_KEY_ID --project-name kontenmu
          echo -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" | npx wrangler pages secret put R2_SECRET_ACCESS_KEY --project-name kontenmu
          echo -n "${{ secrets.R2_ACCOUNT_ID }}" | npx wrangler pages secret put R2_ACCOUNT_ID --project-name kontenmu

      - name: Set Backend Authentication Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo -n "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
        working-directory: workers/sales-api

      - name: Deploy Backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: workers/sales-api

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kontenmu --branch main
          workingDirectory: apps/portal-agen
